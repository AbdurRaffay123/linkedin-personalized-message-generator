<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Sales Assistant</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        width: 380px; margin: 0; padding: 14px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: Canvas; color: CanvasText;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      button {
        font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 8px;
        border: 1px solid transparent; background: #2563eb; color: #fff; cursor: pointer;
        width: 100%;
      }
      button:disabled { opacity: .55; cursor: default; }
      button.secondary { background: transparent; border-color: #8884; color: inherit; }
      .muted { opacity: .7; }
      .stage { font-size: 12px; margin-top: 8px; }
      .card { border: 1px solid #8883; border-radius: 10px; padding: 10px; margin-top: 10px; }
      .score { font-size: 22px; font-weight: 700; }
      .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #8882; margin-left: 6px; }
      .evi { font-size: 12px; opacity: .8; margin: 2px 0 0 10px; }
      .err { color: #dc2626; font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
      textarea { width: 100%; min-height: 90px; font: inherit; border-radius: 8px; padding: 8px; }
      .row { display: flex; gap: 8px; margin-top: 8px; }
      .row > * { flex: 1; }
      section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .6; margin: 12px 0 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
